---
# ansible/roles/voiceassistant/tasks/service.yml
# v1

- name: Reload systemd user daemon
  ansible.builtin.systemd:
    daemon_reload: yes
    scope: user

- name: Enable and start voiceassistant services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
    scope: user
  loop:
    - wyoming-stt.service
    - wyoming-tts.service
    - lva.service
