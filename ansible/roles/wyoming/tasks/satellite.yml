---
- name: Install wyoming-satellite and VAD dependencies
  ansible.builtin.pip:
    name:
      - "wyoming-satellite"
      - "pysilero-vad"
      - "onnxruntime"
    virtualenv: "{{ mediaplayer_home }}/wyoming/satellite"
    virtualenv_command: "python3 -m venv"
    state: present

- name: Apply stealth VAD patch to satellite.py
  ansible.builtin.copy:
    src: satellite.py
    dest: "{{ mediaplayer_home }}/wyoming/satellite/lib/python3.13/site-packages/wyoming_satellite/satellite.py"
    mode: '0644'
  notify: restart wyoming-satellite

- name: Deploy awake prompt audio
  ansible.builtin.copy:
    src: awake_prompt.wav
    dest: "{{ mediaplayer_home }}/wyoming/satellite/awake_prompt.wav"
    mode: '0644'

- name: Deploy event scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ mediaplayer_home }}/wyoming/satellite/{{ item }}"
    mode: '0755'
  loop:
    - awake.sh
    - done.sh
    - transcript.sh
    - tts-start.sh
    - synthesize.sh

- name: Deploy wyoming-satellite.service
  ansible.builtin.template:
    src: wyoming-satellite.service.j2
    dest: "{{ mediaplayer_home }}/.config/systemd/user/wyoming-satellite.service"
    mode: '0644'
  notify: restart wyoming-satellite
