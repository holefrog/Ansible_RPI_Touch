---
- name: Install Wyoming dependencies
  become: yes
  ansible.builtin.apt:
    name:
      - python3-venv
      - python3-pip
      - portaudio19-dev
      - ffmpeg
      - espeak
    state: present

- name: Create Wyoming base directory
  ansible.builtin.file:
    path: "{{ mediaplayer_home }}/wyoming"
    state: directory
    mode: '0755'
