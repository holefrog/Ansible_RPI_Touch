# ansible/roles/wyoming/tasks/whisper.yml  v2
# 替换 wyoming-faster-whisper 为 sherpa-onnx STT server

- name: Install sherpa-onnx STT dependencies
  ansible.builtin.pip:
    name:
      - sherpa-onnx
      - wyoming
      - numpy
    virtualenv: "{{ mediaplayer_home }}/wyoming/sherpa-stt"
    virtualenv_command: "python3 -m venv"
    state: present

- name: Create STT model directory
  ansible.builtin.file:
    path: "{{ mediaplayer_home }}/wyoming/sherpa-stt/model"
    state: directory
    mode: '0755'

- name: Download SenseVoice int8 model
  ansible.builtin.get_url:
    url: "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17-int8.tar.bz2"
    dest: "/tmp/sense-voice-int8.tar.bz2"
    mode: '0644'
  register: model_download

- name: Extract SenseVoice model
  ansible.builtin.unarchive:
    src: "/tmp/sense-voice-int8.tar.bz2"
    dest: "{{ mediaplayer_home }}/wyoming/sherpa-stt/model"
    remote_src: yes
    extra_opts: ["--strip-components=1"]
    creates: "{{ mediaplayer_home }}/wyoming/sherpa-stt/model/model.int8.onnx"

- name: Deploy sherpa_stt_server.py
  ansible.builtin.copy:
    src: sherpa_stt_server.py
    dest: "{{ mediaplayer_home }}/wyoming/sherpa-stt/sherpa_stt_server.py"
    mode: '0644'
  notify: restart wyoming-whisper

- name: Deploy wyoming-whisper.service
  ansible.builtin.template:
    src: wyoming-whisper.service.j2
    dest: "{{ mediaplayer_home }}/.config/systemd/user/wyoming-whisper.service"
    mode: '0644'
  notify: restart wyoming-whisper
