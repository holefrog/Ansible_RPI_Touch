# ansible/roles/wyoming/tasks/piper.yml  v2
# 替换 wyoming-piper 为 sherpa-onnx TTS server

- name: Install sherpa-onnx TTS dependencies
  ansible.builtin.pip:
    name:
      - sherpa-onnx
      - wyoming
      - numpy
    virtualenv: "{{ mediaplayer_home }}/wyoming/sherpa-tts"
    virtualenv_command: "python3 -m venv"
    state: present

- name: Create TTS model directory
  ansible.builtin.file:
    path: "{{ mediaplayer_home }}/wyoming/sherpa-tts/model"
    state: directory
    mode: '0755'

- name: Download matcha-icefall-zh-baker model
  ansible.builtin.get_url:
    url: "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/matcha-icefall-zh-baker.tar.bz2"
    dest: "/tmp/matcha-zh-baker.tar.bz2"
    mode: '0644'
  register: tts_model_download

- name: Extract matcha model
  ansible.builtin.unarchive:
    src: "/tmp/matcha-zh-baker.tar.bz2"
    dest: "{{ mediaplayer_home }}/wyoming/sherpa-tts/model"
    remote_src: yes
    extra_opts: ["--strip-components=1"]
    creates: "{{ mediaplayer_home }}/wyoming/sherpa-tts/model/model-steps-3.onnx"

- name: Download hifigan vocoder
  ansible.builtin.get_url:
    url: "https://github.com/k2-fsa/sherpa-onnx/releases/download/vocoder-models/hifigan_v2.onnx"
    dest: "{{ mediaplayer_home }}/wyoming/sherpa-tts/model/hifigan_v2.onnx"
    mode: '0644'

- name: Deploy sherpa_tts_server.py
  ansible.builtin.copy:
    src: sherpa_tts_server.py
    dest: "{{ mediaplayer_home }}/wyoming/sherpa-tts/sherpa_tts_server.py"
    mode: '0644'
  notify: restart wyoming-piper

- name: Deploy wyoming-piper.service
  ansible.builtin.template:
    src: wyoming-piper.service.j2
    dest: "{{ mediaplayer_home }}/.config/systemd/user/wyoming-piper.service"
    mode: '0644'
  notify: restart wyoming-piper
