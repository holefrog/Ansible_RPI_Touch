---
- name: Ensure media player user has passwordless sudo
  become: yes
  ansible.builtin.lineinfile:
    path: "/etc/sudoers.d/010_{{ mediaplayer_user }}-nopasswd"
    state: present
    create: yes
    mode: '0440'
    line: "{{ mediaplayer_user }} ALL=(ALL) NOPASSWD: ALL"
    validate: 'visudo -cf %s'

- name: Enable user Linger mode (Required for user systemd services)
  become: yes
  ansible.builtin.command: "loginctl enable-linger {{ mediaplayer_user }}"
  changed_when: false

- name: Set system timezone
  become: yes
  ansible.builtin.command: "timedatectl set-timezone {{ system_timezone | default('America/Vancouver') }}"
  changed_when: false

- name: Ensure en_GB.UTF-8 locale is enabled
  become: yes
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?\s*en_GB\.UTF-8\s+UTF-8'
    line: 'en_GB.UTF-8 UTF-8'
  register: locale_gen

- name: Generate locales
  become: yes
  ansible.builtin.command: locale-gen
  when: locale_gen.changed

- name: Add bash alias ll='ls -l'
  ansible.builtin.lineinfile:
    path: "{{ mediaplayer_home }}/.bashrc"
    line: "alias ll='ls -l'"
    state: present
  become: yes
  become_user: "{{ mediaplayer_user }}"

- name: Add bash alias for checking all media services status
  ansible.builtin.lineinfile:
    path: "{{ mediaplayer_home }}/.bashrc"
    line: "alias check_status='systemctl --user status pipewire wireplumber squeezelite shairport-sync volume && systemctl status splash_service bluetooth bluetooth-a2dp-autopair'"
    state: present
    create: yes
  become: yes
  become_user: "{{ mediaplayer_user }}"

- name: Disable cloud-init to speed up early boot
  become: yes
  ansible.builtin.file:
    path: /etc/cloud/cloud-init.disabled
    state: touch

- name: Disable NetworkManager-wait-online service
  become: yes
  ansible.builtin.systemd:
    name: NetworkManager-wait-online.service
    enabled: no
    masked: yes

- name: Mount /tmp as tmpfs to eliminate I/O bottleneck and maximize performance
  become: yes
  ansible.posix.mount:
    path: /tmp
    src: tmpfs
    fstype: tmpfs
    opts: defaults,noatime,nosuid,size=500m
    state: mounted
  ignore_errors: yes

- name: Disable and remove dphys-swapfile to eliminate SD card paging I/O
  become: yes
  ansible.builtin.apt:
    name: dphys-swapfile
    state: absent
    purge: yes

- name: Mount /var/tmp as tmpfs to eliminate I/O bottleneck
  become: yes
  ansible.posix.mount:
    path: /var/tmp
    src: tmpfs
    fstype: tmpfs
    opts: defaults,noatime,nosuid,size=250m
    state: mounted
  ignore_errors: yes

- name: Tune kernel sysctl for 4GB RAM to maximize performance
  become: yes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { key: 'vm.vfs_cache_pressure', value: '50' }
    - { key: 'vm.dirty_ratio', value: '20' }
    - { key: 'vm.dirty_background_ratio', value: '10' }

- name: Disable Wi-Fi power management in NetworkManager to prevent ARP drops
  become: yes
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/default-wifi-powersave-on.conf
    content: |
      [connection]
      wifi.powersave = 2
    mode: '0644'