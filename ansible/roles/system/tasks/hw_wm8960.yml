---
- name: Ensure device-tree-compiler is installed
  become: yes
  ansible.builtin.apt:
    name: device-tree-compiler
    state: present

- name: Copy custom WM8960 Audio Card DTS
  ansible.builtin.copy:
    src: wm8960-audio-card.dts
    dest: /tmp/wm8960-audio-card.dts

- name: Compile WM8960 Audio Card overlay
  become: yes
  ansible.builtin.command:
    cmd: dtc -@ -b 0 -Wno-unit_address_vs_reg -I dts -O dtb -o /boot/firmware/overlays/wm8960-audio-card.dtbo /tmp/wm8960-audio-card.dts
  register: dtc_result
  changed_when: dtc_result.rc == 0

- name: Configure WM8960 audio driver in boot config
  become: yes
  ansible.builtin.lineinfile:
    path: "{{ boot_config_file }}"
    line: "{{ item }}"
    state: present
  loop:
    - "dtparam=i2s=on"
    - "dtparam=audio=off"
    - "dtoverlay=wm8960-audio-card"
    - "dtoverlay=i2s-mmap"
  register: wm8960_boot_config

- name: Remove old wm8960-soundcard from boot config
  become: yes
  ansible.builtin.lineinfile:
    path: "{{ boot_config_file }}"
    line: "dtoverlay=wm8960-soundcard"
    state: absent
  register: wm8960_boot_config_old

- name: Reboot if WM8960 boot config changed
  become: yes
  ansible.builtin.reboot:
    msg: "Rebooting to apply new WM8960 Audio Card device tree overlay"
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: whoami
  when: >
    (wm8960_boot_config is defined and wm8960_boot_config.changed) or
    (wm8960_boot_config_old is defined and wm8960_boot_config_old.changed)

- name: Configure WM8960 amixer settings
  become: yes
  ansible.builtin.shell: |
    amixer -c wm8960audiocard cset name='Left Boost Mixer LINPUT1 Switch' on
    amixer -c wm8960audiocard cset name='Left Input Mixer Boost Switch' on
    amixer -c wm8960audiocard cset name='Capture Switch' on
    amixer -c wm8960audiocard cset name='Capture Volume' 63
    amixer -c wm8960audiocard cset name='ADC PCM Capture Volume' 255
    amixer -c wm8960audiocard cset name='ADC Data Output Select' 1