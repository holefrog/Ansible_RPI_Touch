---
- name: Copy touch GUI source files to target host
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ touch_app_dir }}/{{ item }}"
    mode: '0644'
  with_fileglob:
    - "*.c"
    - "*.h"
    - "CMakeLists.txt"
  become: no

- name: Ensure touch GUI build directory exists
  ansible.builtin.file:
    path: "{{ touch_build_dir }}"
    state: directory
    mode: '0755'
  become: no

- name: Configure touch GUI CMake build
  ansible.builtin.command:
    cmd: cmake "{{ touch_app_dir }}"
    chdir: "{{ touch_build_dir }}"
  args:
    creates: "{{ touch_build_dir }}/CMakeCache.txt"
  become: no

- name: Build touch GUI binary
  ansible.builtin.command:
    cmd: make -j "{{ touch_compile_threads }}"
    chdir: "{{ touch_build_dir }}"
  args:
    creates: "{{ touch_build_dir }}/touch_gui"
  become: no
