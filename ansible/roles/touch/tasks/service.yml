---
- name: Ensure user systemd directory exists for touch GUI
  ansible.builtin.file:
    path: "{{ mediaplayer_home }}/.config/systemd/user"
    state: directory
    mode: '0755'
  become: no

- name: Generate touch GUI systemd user service
  ansible.builtin.template:
    src: touch_gui.service.j2
    dest: "{{ touch_service_unit }}"
    mode: '0644'
  become: no

- name: Enable and start touch GUI user service
  ansible.builtin.systemd:
    name: "{{ touch_service_name }}"
    state: started
    enabled: yes
    scope: user
  become: no
